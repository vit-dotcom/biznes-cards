function renderCards(list) {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  list.forEach((ad, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    let badge = '';
    if (ad.sale) badge = '<span class="badge-sale">скидка</span>';
    if (ad.paused) badge = '<span class="badge-paused">продажа приостановлена</span>';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-num">${ad.num}</div>
          <div class="card-title">${ad.title} ${badge}</div>
          <div class="card-price">${ad.price}</div>
          <div class="card-profit">${ad.profit}</div>
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="detail-label">📌 КОРОТКО — ГЛАВНОЕ</div>
        <div class="hook-block">${ad.hook}</div>
        <div class="detail-label">📋 ПОДРОБНОЕ ОПИСАНИЕ</div>
        <div class="detail-block">${ad.detail}</div>
        <button class="copy-btn">Скопировать объявление</button>
      </div>
    `;
    container.appendChild(card);

    card.querySelector('.card-header').addEventListener('click', () => {
      card.classList.toggle('open');
    });

    card.querySelector('.copy-btn').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const text = ad.hook + '\n\n' + ad.detail;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✓ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Скопировать объявление';
          btn.classList.remove('copied');
        }, 2000);
      });
    });
  });
}

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = ads.filter(a =>
    a.num.toLowerCase().includes(q) ||
    a.title.toLowerCase().includes(q) ||
    a.price.toLowerCase().includes(q)
  );
  renderCards(filtered);
}

renderCards(ads);
</script>
